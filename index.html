<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>数学キーボード</title>
<link rel="stylesheet" href="style.css">
<script defer src="vendor/mathlive.min.js"></script>
<script defer src="app.js"></script>
</head>
<body><main>
<header><p class="eyebrow">MY MATH NOTE</p><h1>数学キーボード</h1><p>式の空欄をタップして、そのまま入力。</p></header>
<section class="panel" aria-label="数式エディタ">
<label for="expr">数式</label>
<math-field id="expr" math-virtual-keyboard-policy="manual" aria-label="数式入力欄"></math-field>
<p class="hint">分子・分母・指数・上下限も自由に編集できます。「次の空欄」で移動。</p>
<div class="navigation" id="navigation"></div>
<div class="actions"><button id="undo">元に戻す</button><button id="clear">全消去</button><button id="copy" class="primary">LaTeXコピー</button></div>
<p id="status" role="status" aria-live="polite">読み込み中…</p>
<details><summary>LaTeXを表示・手動コピー</summary><textarea id="latex" readonly aria-label="LaTeX出力" spellcheck="false"></textarea></details>
</section>
<section class="panel keyboard" aria-label="タッチキーボード">
<div class="tabs" role="tablist" aria-label="キーの種類"></div><div id="keys" class="grid" role="tabpanel"></div>
</section>
<p class="footnote">数式の中をタップ、または矢印で移動できます。入れ子の分数や根号にも対応。端末のキーボードからの入力も使えます。</p>
<noscript>数式エディタを使うにはJavaScriptを有効にしてください。</noscript>
</main></body></html>
