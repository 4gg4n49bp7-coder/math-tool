<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f8fafc"><title>数学入力ノート</title><script defer src="https://unpkg.com/mathlive@0.104.2/mathlive.min.js"></script><style>:root{font-family:-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN',sans-serif;color:#17233b;background:#f5f7fb}*{box-sizing:border-box}body{margin:0;padding:16px 14px 40px;max-width:760px;margin:auto}h1{font-size:22px;margin:8px 0 4px}p{color:#58657a;font-size:13px;line-height:1.5}.card{background:white;border:1px solid #dce3ee;border-radius:16px;padding:14px;margin:14px 0;box-shadow:0 2px 8px #20304a08}label{font-weight:700;font-size:14px;display:block;margin-bottom:8px}math-field{display:block;min-height:92px;width:100%;font-size:27px;border:1px solid #cad4e4;border-radius:12px;padding:12px;background:#fff;--caret-color:#2563eb;--selection-background-color:#dbeafe}textarea{width:100%;min-height:84px;border:1px solid #cad4e4;border-radius:12px;padding:12px;font-size:16px;resize:vertical}button{border:1px solid #ccd6e5;background:white;border-radius:11px;min-height:44px;padding:8px 12px;font-size:15px;color:#18253b;cursor:pointer}button:active{background:#e7efff}.primary{background:#2563eb;color:white;border-color:#2563eb}.toolbar{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}.toolbar button{font-size:19px;padding:6px 3px}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button{flex:1}.small{font-size:12px;color:#64748b}.status{font-size:13px;color:#166534;min-height:20px}.preview{white-space:pre-wrap;word-break:break-word;background:#f1f5f9;border-radius:10px;padding:12px;font-size:14px;min-height:45px}details{margin-top:12px}summary{cursor:pointer;font-size:13px;color:#475569}</style></head><body><h1>∫ 数学入力ノート</h1><p>iPhoneのSafariで使う数式入力ツール。記号を押して式を作り、ChatGPTに貼り付けられます。</p><section class="card"><label for="math">数式を入力</label><math-field id="math" math-virtual-keyboard-policy="manual" aria-label="数式入力欄">\int_0^1 x^2\,dx</math-field><p class="small">数式をタップして編集。分数・積分の上下もタップして移動できます。</p><div class="toolbar" id="keys"></div><div class="actions" style="margin-top:10px"><button id="keyboard">⌨ 数式キーボード</button><button id="backspace">⌫ 1文字削除</button><button id="clear">消去</button></div></section><section class="card"><label for="note">質問・途中の考え（日本語）</label><textarea id="note" placeholder="例：この積分の解き方を、答えを出さずにヒントだけ教えて。"></textarea><div class="actions" style="margin-top:10px"><button class="primary" id="copyAll">文章＋数式をコピー</button><button id="copyMath">数式だけコピー</button></div><p class="status" id="status" aria-live="polite"></p><label>ChatGPTに渡す内容</label><div class="preview" id="preview"></div></section><details><summary>使い方・注意点</summary><p>① 数式欄をタップ ② 記号ボタンを使って編集 ③ コピー ④ ChatGPTに貼り付け。インターネット接続が必要です（MathLiveを読み込むため）。このファイルは端末内で動作し、入力内容を外部へ送信しません。コピー操作のみ行います。Safariで直接ファイルを開けない場合は、静的サイトとして公開する方法が必要です。</p></details><script>
const specs=[['∫','\\int_{\\placeholder{0}}^{\\placeholder{1}}'],['∮','\\oint'],['∑','\\sum_{i=1}^{n}'],['分数','\\frac{\\placeholder{a}}{\\placeholder{b}}'],['√','\\sqrt{\\placeholder{x}}'],['x²','^{2}'],['xⁿ','^{\\placeholder{n}}'],['下付き','_{\\placeholder{i}}'],['π','\\pi'],['∞','\\infty'],['≤','\\le'],['≥','\\ge'],['≠','\\ne'],['±','\\pm'],['∩','\\cap'],['∪','\\cup'],['∈','\\in'],['⊂','\\subset'],['¬','\\neg'],['∧','\\land'],['∨','\\lor'],['⇒','\\Rightarrow'],['∀','\\forall'],['∃','\\exists']];
const field=document.getElementById('math'), note=document.getElementById('note'), preview=document.getElementById('preview'),status=document.getElementById('status');
const keys=document.getElementById('keys');specs.forEach(([label,latex])=>{const b=document.createElement('button');b.textContent=label;b.type='button';b.onclick=()=>{field.focus();field.executeCommand(['insert',latex,{selectionMode:'placeholder'}]);update()};keys.appendChild(b)});
function content(){return `${note.value.trim()}${note.value.trim()?'\n\n':''}数式（LaTeX）: ${field.value||''}`}
function update(){preview.textContent=content()}
field.addEventListener('input',update);note.addEventListener('input',update);document.getElementById('clear').onclick=()=>{field.value='';field.focus();update()};document.getElementById('backspace').onclick=()=>{field.focus();field.executeCommand('deleteBackward');update()};document.getElementById('keyboard').onclick=()=>{field.focus();window.mathVirtualKeyboard?.show()};
async function copy(s){try{await navigator.clipboard.writeText(s);status.textContent='コピーしました。ChatGPTに貼り付けてください。'}catch(e){const t=document.createElement('textarea');t.value=s;document.body.append(t);t.select();let ok=document.execCommand('copy');t.remove();status.textContent=ok?'コピーしました。':'コピーできませんでした。下の内容を長押ししてコピーしてください。'}}
document.getElementById('copyAll').onclick=()=>copy(content());document.getElementById('copyMath').onclick=()=>copy(field.value);customElements.whenDefined('math-field').then(()=>{field.mathVirtualKeyboardPolicy='manual';update()});update();
</script></body></html>
